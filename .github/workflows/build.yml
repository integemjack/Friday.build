name: Build and release Friday

# 本仓库只负责构建与发布：
#   1. 由源码仓库（integemjack/Friday）每次提交通过 repository_dispatch 触发，或在 Actions 页面手动运行；
#   2. 用 SOURCE_TOKEN 拉取私有源码仓库的指定提交；
#   3. prepare：定版本号 X.Y.Z：vX.Y 分支用分支名做前缀；main 等其余分支取「工程 MARKETING_VERSION 的前两位、
#      已合并进来的 vX.Y 分支、已发布正式版」中最大的 X.Y（合并 vX.Y 进 main 就自动发 X.Y.Z，不用改工程版本号）；第三位从 0 起，
#      每次打包自动 +1（按已有标签数）；main 分支的提交发正式版（标签 vX.Y.Z），其他分支发预发布（vX.Y.Z-beta）；
#   4. macos：导入 Developer ID 证书，调用源码里的 Friday/Tools/CI/build.sh 构建、签名、打包，再签 dmg、公证并钉票据
#      （缺证书或公证密钥、公证不通过都直接失败，不发未公证的包）；
#      qt：Windows / Linux 的 Qt 版（调用源码里的 qt/ci/ 脚本）：Windows 出 zip 便携版 + 安装程序
#      （-setup.exe，源码 qt/installer/ 的自制安装器；在运行器上静默装一遍、卸一遍核对），Linux 出 AppImage + tar.gz + deb
#      （deb 在运行器上 apt 装一遍核对）；老源码没有安装程序时只出 zip。
#      v2.0 起源码不带本地推理：每个平台一套包；老源码（还有 qt/ci/build_backends.sh）照旧 CUDA 与 Vulkan 各一套；
#   5. release：macOS 成功才发布（Qt 某个组合失败照样发布其余产物，并在说明里注明缺哪些）；
#      正式版和预发布各只保留最新的一个 Release（旧的连安装包一起删，标签保留以便继续计数）；
#   6. 发布后更新仓库根目录的 latest.json（每个渠道最新的一次发布，含各平台安装包 assets），Friday 应用定期读它来自动更新。
on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      ref:
        description: "源码分支（默认 main；main 发正式版，其他分支发预发布）"
        required: false
        default: "main"
      version:
        description: "指定完整版本号（如 1.2.0）。留空则自动：前缀 + 第三位自增"
        required: false
        default: ""
      prerelease:
        description: "main 也按预发布发"
        type: boolean
        default: false
      qt:
        description: "同时构建 Windows / Linux 版（Qt）"
        type: boolean
        default: true

permissions:
  contents: write

# 不设工作流级并发组：GitHub 的并发组只保留一个排队中的运行，新的推送会把排队中的旧运行直接取消
# （Qt 版一轮要很久，多个分支 / 会话同时推送时几乎每次都会被顶掉）。改为：
#   - 各次运行的构建互不等待、并行进行；
#   - 版本号在 prepare 里用「推送标签」原子预留（撞号就重试），并行运行不会拿到同一个号；
#   - release 只往前走：每个渠道只保留版本最大的 Release，latest.json 不会被较旧的运行改回去。

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  SOURCE_REPO: ${{ vars.SOURCE_REPO || 'integemjack/Friday' }}
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  PACKAGES_DIR: ${{ github.workspace }}/build/SourcePackages

jobs:
  # ---------------------------------------------------------------------------
  # 源码提交、版本号、渠道、标签（后面所有 job 共用）
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve source and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.src.outputs.ref }}
      ref_name: ${{ steps.src.outputs.ref_name }}
      subject: ${{ steps.src.outputs.subject }}
      sha: ${{ steps.inspect.outputs.sha }}
      min_os: ${{ steps.inspect.outputs.min_os }}
      has_qt: ${{ steps.inspect.outputs.has_qt }}
      has_installer: ${{ steps.inspect.outputs.has_installer }}
      qt_backends: ${{ steps.inspect.outputs.qt_backends }}
      has_mlx: ${{ steps.inspect.outputs.has_mlx }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      marketing: ${{ steps.version.outputs.marketing }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - name: Resolve source revision
        id: src
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_REF_NAME: ${{ github.event.client_payload.ref_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.subject }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            REF="${DISPATCH_SHA}"; REF_NAME="${DISPATCH_REF_NAME}"; TAG="${DISPATCH_TAG}"; SUBJECT="${DISPATCH_SUBJECT}"
          else
            REF="${INPUT_REF:-main}"; REF_NAME="${REF}"; TAG="${INPUT_VERSION:-}"; SUBJECT="手动构建"
            if [ -n "${TAG}" ] && [[ "${TAG}" != v* ]]; then TAG="v${TAG}"; fi
          fi
          {
            echo "ref=${REF}"
            echo "ref_name=${REF_NAME}"
            echo "tag=${TAG}"
            echo "subject=${SUBJECT}"
          } >> "${GITHUB_OUTPUT}"
          echo "源码 ${SOURCE_REPO} @ ${REF}（${REF_NAME}），标签 '${TAG}'：${SUBJECT}"

      - name: Checkout source (version files only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.src.outputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          # 完整提交历史（稀疏检出自带 --filter=blob:none，只拉提交和目录树，不拉文件内容）：
          # 定版本号时要看已合并进来的 vX.Y 分支
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Friday/Friday.xcodeproj/project.pbxproj
            /qt/CMakeLists.txt
            /qt/ci/deps.env
            /qt/ci/build_backends.sh
            /qt/installer/CMakeLists.txt

      - name: Inspect source
        id: inspect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_QT: ${{ inputs.qt }}
        run: |
          set -euo pipefail
          # 手动运行时 ref 可能是分支名：解析成具体提交，macOS 与 Qt 各 job 都拉同一个提交
          SHA="$(git -C src rev-parse HEAD)"
          MIN_OS="$(grep -m1 -E 'MACOSX_DEPLOYMENT_TARGET = ' src/Friday/Friday.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);.*/\1/' | tr -d '"')"
          # 老分支还没有 qt/ 目录时不构建 Qt 版；手动运行可以关掉
          HAS_QT=false
          if [ -f src/qt/CMakeLists.txt ] && [ -f src/qt/ci/deps.env ]; then HAS_QT=true; fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_QT}" = "false" ]; then HAS_QT=false; fi
          # 源码有 qt/installer/（自制 Windows 安装程序）时 Windows 另出 -setup.exe、Linux 另出 deb；老分支只出 zip / AppImage / tar.gz
          HAS_INSTALLER=false
          if [ "${HAS_QT}" = "true" ] && [ -f src/qt/installer/CMakeLists.txt ]; then HAS_INSTALLER=true; fi
          # Qt 版有几套包：源码还带本地推理（有 qt/ci/build_backends.sh，v2.0 之前）时 CUDA 与 Vulkan 各一套；
          # v2.0 起不带，每个平台一套（矩阵里记作 none，包名、latest.json 的键都不带后端）
          QT_BACKENDS='["none"]'
          if [ -f src/qt/ci/build_backends.sh ]; then QT_BACKENDS='["cuda","vulkan"]'; fi
          # macOS 版还用 MLX（本地模型跑在 Metal 上）时才要装 Metal 编译器
          HAS_MLX=false
          if grep -q 'mlx-swift' src/Friday/Friday.xcodeproj/project.pbxproj; then HAS_MLX=true; fi
          {
            echo "sha=${SHA}"
            echo "min_os=${MIN_OS:-26.0}"
            echo "has_qt=${HAS_QT}"
            echo "has_installer=${HAS_INSTALLER}"
            echo "qt_backends=${QT_BACKENDS}"
            echo "has_mlx=${HAS_MLX}"
          } >> "${GITHUB_OUTPUT}"
          echo "提交 ${SHA}，最低 macOS ${MIN_OS:-26.0}，构建 Qt 版=${HAS_QT}（${QT_BACKENDS}），安装程序 / deb=${HAS_INSTALLER}，MLX=${HAS_MLX}"

      - name: Checkout this repository (for tag reservation)
        uses: actions/checkout@v4
        with:
          path: self
          ref: main
          fetch-depth: 1

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ steps.src.outputs.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(grep -m1 -E 'MARKETING_VERSION = ' src/Friday/Friday.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);.*/\1/' | tr -d '"')"
          PROJECT_VERSION="${PROJECT_VERSION:-1.0}"
          # 版本前缀 X.Y：vX.Y 分支用分支名；main 等其余分支取下面三者中最大的：
          #   1. 工程 MARKETING_VERSION 的前两位；
          #   2. 已合并进这个提交的 vX.Y 分支：主线历史上的合并提交标题（「合并 vX.Y：…」、git 默认的
          #      「Merge branch 'vX.Y'」、GitHub 的「Merge pull request #N from 用户/vX.Y」），以及远程仍在、
          #      已完全合并进来的 vX.Y 分支（合并完分支常被删掉，所以两种都看）；
          #   3. 已发布正式版的最大 X.Y：正式版号只升不降（否则已装新版本的用户永远等不到更新）。
          # 以前 main 只看 MARKETING_VERSION：合并 v1.1 / v1.2 / v1.3 后仍发 v1.0.x，要手动改工程版本号才会变。
          if [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            PREFIX="${REF_NAME#v}"
          else
            PROJECT_PREFIX="$(printf '%s' "${PROJECT_VERSION}" | awk -F. '{ printf "%d.%d", $1, ($2 == "" ? 0 : $2) }')"
            MERGED="$( {
              git -C src log --first-parent --merges --format=%s HEAD \
                | { grep -oE "^(合并 |Merge branch '|Merge pull request #[0-9]+ from [^ ]+/)v[0-9]+\.[0-9]+" || true; } \
                | grep -oE '[0-9]+\.[0-9]+$' || true
              git -C src for-each-ref --merged HEAD --format='%(refname:short)' 'refs/remotes/origin/v*' \
                | sed 's#^origin/v##' | { grep -E '^[0-9]+\.[0-9]+$' || true; }
            } | sort -V | uniq | tr '\n' ' ')"
            STABLE="$(git ls-remote --tags --refs "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
              | sed -E 's#.*refs/tags/v##' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/' | sort -V | tail -1)"
            PREFIX="$(printf '%s\n' "${PROJECT_PREFIX}" ${MERGED} ${STABLE} | { grep -E '^[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
            echo "版本前缀 ${PREFIX}：工程 ${PROJECT_PREFIX}，已合并的 vX.Y 分支 [${MERGED% }]，已发布正式版最大 ${STABLE:-无}"
          fi
          # 渠道：main 发正式版，其他分支发预发布（手动运行可以强制预发布）
          if [ "${REF_NAME}" = "main" ] && [ "${FORCE_PRERELEASE:-false}" != "true" ]; then
            CHANNEL=stable
          else
            CHANNEL=beta
          fi
          tag_for() { if [ "${CHANNEL}" = "stable" ]; then echo "v$1"; else echo "v$1-beta"; fi; }
          other_for() { if [ "${CHANNEL}" = "stable" ]; then echo "v$1-beta"; else echo "v$1"; fi; }
          if [ -n "${INPUT_VERSION}" ]; then
            MARKETING="${INPUT_VERSION#v}"
            [[ "${MARKETING}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号 '${INPUT_VERSION}' 必须是 X.Y.Z" >&2; exit 1; }
            # 手动指定的版本：标签已存在就沿用（重新发布同一个版本），不存在就建
            git -C self push -q origin "HEAD:refs/tags/$(tag_for "${MARKETING}")" 2>/dev/null || true
          else
            # 第三位：这个前缀下已有标签（正式版、预发布共用一个序列）的最大值 +1，没有就从 0 开始。
            # 并行的运行可能同时算出同一个号，所以用「推送标签」原子预留：推不上去（已被占）就重算重试；
            # 推上去以后如果另一个渠道同时占了同一个号（v1.2.3 与 v1.2.3-beta 是两个不同的标签），自己让出再重试。
            # 预留后构建失败的号不会回收（版本号可能跳号）。
            ESCAPED="${PREFIX//./\\.}"
            MARKETING=""
            for attempt in $(seq 1 20); do
              LAST="$(git ls-remote --tags --refs "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/tags/v${PREFIX}.*" \
                | sed -E 's#.*refs/tags/v##' \
                | { grep -E "^${ESCAPED}\.[0-9]+(-.*)?$" || true; } \
                | sed -E 's/^[0-9]+\.[0-9]+\.([0-9]+).*/\1/' | sort -n | tail -1)"
              if [ -n "${LAST}" ]; then PATCH=$((LAST + 1)); else PATCH=0; fi
              CANDIDATE="${PREFIX}.${PATCH}"
              if git -C self push -q origin "HEAD:refs/tags/$(tag_for "${CANDIDATE}")" 2>/dev/null; then
                if git ls-remote --exit-code --tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/tags/$(other_for "${CANDIDATE}")" >/dev/null 2>&1; then
                  echo "版本 ${CANDIDATE} 同时被另一个渠道占用，让出后重试"
                  git -C self push -q origin ":refs/tags/$(tag_for "${CANDIDATE}")" || true
                else
                  MARKETING="${CANDIDATE}"
                  break
                fi
              else
                echo "版本 ${CANDIDATE} 已被其他运行预留，重试（第 ${attempt} 次）"
              fi
              sleep $((RANDOM % 5 + 1))
            done
            [ -n "${MARKETING}" ] || { echo "预留版本号失败（重试 20 次）" >&2; exit 1; }
          fi
          RELEASE_TAG="$(tag_for "${MARKETING}")"
          if [ "${CHANNEL}" = "stable" ]; then
            PRERELEASE=false
            TITLE="Friday ${MARKETING} 正式版"
          else
            PRERELEASE=true
            TITLE="Friday ${MARKETING} Beta（${REF_NAME}）"
          fi
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "marketing=${MARKETING}"
            echo "channel=${CHANNEL}"
            echo "prerelease=${PRERELEASE}"
            echo "title=${TITLE}"
          } >> "${GITHUB_OUTPUT}"
          echo "分支 ${REF_NAME} → 版本 ${MARKETING}，构建号 ${GITHUB_RUN_NUMBER}，渠道 ${CHANNEL}，Release 标签 ${RELEASE_TAG}，预发布=${PRERELEASE}"

  # ---------------------------------------------------------------------------
  # macOS（Swift）：构建、签名、公证，产物上传为 artifact，由 release 统一发布
  # ---------------------------------------------------------------------------
  macos:
    name: Build and sign (macOS arm64)
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          fetch-depth: 1

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "${XCODE}" ] || XCODE="/Applications/Xcode.app"
          echo "使用 ${XCODE}"
          sudo xcode-select -s "${XCODE}"
          xcodebuild -version
          sw_vers

      - name: Install Metal toolchain
        if: needs.prepare.outputs.has_mlx == 'true'
        run: |
          # MLX 的 Metal 内核需要 Metal 编译器（Xcode 26 起需单独下载）
          if xcrun metal --version >/dev/null 2>&1; then
            echo "Metal 编译器已可用"
          else
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          xcrun metal --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('src/Friday/Friday.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/Build
            build/DerivedData/ModuleCache.noindex
          key: build-${{ runner.os }}-${{ hashFiles('src/Friday/Friday.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ needs.prepare.outputs.ref }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('src/Friday/Friday.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            build-${{ runner.os }}-

      # 发布出去的 macOS 包必须是 Developer ID 签名 + 公证的：缺证书时直接失败，不再退回临时签名
      - name: Import signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ] || [ -z "${CODE_SIGN_IDENTITY:-}" ]; then
            echo "::error::未配置 Developer ID 证书（secrets.MACOS_CERTIFICATE_P12 / vars.CODE_SIGN_IDENTITY），macOS 包必须签名公证后才发布"
            exit 1
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          CERT="${RUNNER_TEMP}/certificate.p12"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${CERT}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain
          rm -f "${CERT}"
          echo "keychain=${KEYCHAIN}" >> "${GITHUB_OUTPUT}"
          echo "可用签名身份："
          security find-identity -v -p codesigning "${KEYCHAIN}" | tee "${RUNNER_TEMP}/identities.txt"
          # 证书过期 / 导错证书时在这里停下，而不是到构建时才发现
          grep -qF "\"${CODE_SIGN_IDENTITY}\"" "${RUNNER_TEMP}/identities.txt" || { echo "::error::钥匙串里没有有效的「${CODE_SIGN_IDENTITY}」"; exit 1; }

      # `xcodebuild build`（不是 archive）默认往签名里注入调试用的 get-task-allow，带着它 Apple 不给公证。
      # 用 XCODE_XCCONFIG_FILE 关掉注入：优先级高于工程设置，不依赖各分支源码里的 build.sh 版本
      - name: Build, sign and package
        env:
          PROJECT_DIR: ${{ github.workspace }}/src/Friday
          OUTPUT_DIR: ${{ github.workspace }}/dist
          LABEL: ${{ needs.prepare.outputs.release_tag }}
          MARKETING_VERSION: ${{ needs.prepare.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/distribution.xcconfig
        run: |
          printf 'CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO\n' > "${XCODE_XCCONFIG_FILE}"
          bash src/Friday/Tools/CI/build.sh

      # build.sh 只签 app，dmg 在这里补 Developer ID 签名；公证 dmg（Apple 会一并登记里面 app 的票据），
      # 把票据钉到 dmg 和 app 上，用钉过票据的 app 重打 zip（自动更新用 zip），最后用 Gatekeeper 的判定确认已公证。
      # 缺公证密钥或公证没通过都直接失败：未公证的包打开时会被 Gatekeeper 拦下，不能发出去。
      - name: Sign dmg, notarize and staple
        env:
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          LABEL: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_ID:-}" ] || [ -z "${NOTARY_ISSUER_ID:-}" ] || [ -z "${NOTARY_KEY_P8:-}" ]; then
            echo "::error::未配置公证用的 App Store Connect API 密钥（secrets.NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY_P8）"
            exit 1
          fi
          APP="${DERIVED_DATA}/Build/Products/Release/Friday.app"
          BASENAME="Friday-${LABEL}-macOS-arm64"
          DMG="dist/${BASENAME}.dmg"
          ZIP="dist/${BASENAME}.zip"
          KEY="${RUNNER_TEMP}/notary.p8"
          printf '%s\n' "${NOTARY_KEY_P8}" > "${KEY}"
          trap 'rm -f "${KEY}"' EXIT
          NOTARY=(--key "${KEY}" --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}")

          # 带调试权限的包公证必然被拒，在本地先拦下，省一轮提交
          if codesign -d --entitlements - --xml "${APP}" 2>/dev/null | grep -q "com.apple.security.get-task-allow"; then
            echo "::error::app 的签名里带着 com.apple.security.get-task-allow（调试权限），公证会被拒"
            exit 1
          fi

          # notarytool 在结果为 Invalid 时不一定返回非零，按 JSON 里的 status 判；没拿到提交号（网络抖动）时重试
          notarize() {
            local file="$1" out id status
            for attempt in 1 2 3; do
              out="$(xcrun notarytool submit "${file}" "${NOTARY[@]}" --wait --timeout 45m --output-format json | grep '^{' | tail -1)" || true
              echo "${out}"
              id="$(plutil -extract id raw -o - - <<< "${out}" 2>/dev/null || true)"
              status="$(plutil -extract status raw -o - - <<< "${out}" 2>/dev/null || true)"
              [ -n "${id}" ] && break
              echo "提交公证失败（第 ${attempt}/3 次）"
              [ "${attempt}" -lt 3 ] && { echo "30 秒后重试"; sleep 30; }
            done
            if [ "${status}" != "Accepted" ]; then
              echo "::error::$(basename "${file}") 公证未通过（${status:-提交失败}）"
              [ -n "${id}" ] && xcrun notarytool log "${id}" "${NOTARY[@]}" || true
              return 1
            fi
          }

          if [ -f "${DMG}" ]; then
            echo "▶ 签名 dmg"
            codesign --force --sign "${CODE_SIGN_IDENTITY}" --timestamp "${DMG}"
            codesign --verify --strict --verbose=2 "${DMG}"
            echo "▶ 公证 dmg"
            notarize "${DMG}"
            xcrun stapler staple "${DMG}"
          else
            echo "▶ 公证 zip"
            notarize "${ZIP}"
          fi
          xcrun stapler staple "${APP}"
          rm -f "${ZIP}"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${ZIP}"

          echo "▶ 校验公证票据与 Gatekeeper 判定"
          xcrun stapler validate "${APP}"
          [ -f "${DMG}" ] && xcrun stapler validate "${DMG}"
          if spctl --status | grep -q "assessments enabled"; then
            REPORT="${RUNNER_TEMP}/spctl.txt"
            spctl -a -vvv -t exec "${APP}" > "${REPORT}" 2>&1 || true
            EXPECT=1
            if [ -f "${DMG}" ]; then
              spctl -a -vvv -t open --context context:primary-signature "${DMG}" >> "${REPORT}" 2>&1 || true
              EXPECT=2
            fi
            cat "${REPORT}"
            if [ "$(grep -c "^source=Notarized Developer ID" "${REPORT}")" -ne "${EXPECT}" ]; then
              echo "::error::Gatekeeper 没有把产物认作已公证的 Developer ID"
              exit 1
            fi
          else
            echo "::warning::运行器关闭了 Gatekeeper 评估，只校验了钉上的票据"
          fi
          (cd dist && shopt -s nullglob && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # GitHub 的产物服务偶尔整段超时（CreateArtifact 重试 5 次都失败）：等一分钟再传一次，免得一次抖动挡住整轮发布
      - name: Upload artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Friday-${{ needs.prepare.outputs.release_tag }}-macOS-arm64
          path: dist/*
          if-no-files-found: error

      - name: Wait before retrying upload
        if: steps.upload.outcome == 'failure'
        run: sleep 60

      - name: Upload artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Friday-${{ needs.prepare.outputs.release_tag }}-macOS-arm64
          path: dist/*
          if-no-files-found: error
          overwrite: true

      - name: Remove temporary keychain
        if: ${{ always() && steps.signing.outputs.keychain != '' }}
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

  # ---------------------------------------------------------------------------
  # Windows / Linux（Qt 6）：v2.0 起每个平台一个包（矩阵的 backend 是 none）；
  # v2.0 之前的源码带本地推理（llama.cpp / stable-diffusion.cpp），CUDA 与 Vulkan 各一个包
  # 工具链版本（Qt，老源码还有 CUDA / Vulkan SDK / 依赖标签）都钉在源码的 qt/ci/deps.env 里
  # ---------------------------------------------------------------------------
  qt:
    name: Qt ${{ matrix.platform }}${{ matrix.backend != 'none' && format(' ({0})', matrix.backend) || '' }}
    needs: prepare
    if: ${{ needs.prepare.outputs.has_qt == 'true' }}
    runs-on: ${{ matrix.os }}
    # Windows 上 CUDA 版要编两份 ggml-cuda（llama.cpp 和 sd.cpp 各一份），没命中缓存时最慢；GitHub 托管机器上限 6 小时
    timeout-minutes: ${{ matrix.backend == 'cuda' && 350 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        backend: ${{ fromJSON(needs.prepare.outputs.qt_backends) }}
        include:
          - os: windows-2022
            platform: windows-x64
          # 22.04（glibc 2.35）上构建，包才能在较老的发行版上运行
          - os: ubuntu-22.04
            platform: linux-x64
    env:
      FRIDAY_DEPS_DIR: ${{ github.workspace }}/deps
      BACKEND_OUT: ${{ github.workspace }}/build/backend
      APP_BUILD: ${{ github.workspace }}/build/app
      APP_STAGE: ${{ github.workspace }}/build/stage
      DIST: ${{ github.workspace }}/dist
      FRIDAY_VERSION: ${{ needs.prepare.outputs.marketing }}
      FRIDAY_BUILD_NUMBER: ${{ github.run_number }}
      FRIDAY_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      FRIDAY_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      FRIDAY_GPU_BACKEND: ${{ matrix.backend != 'none' && matrix.backend || '' }}
      # 产物名：Friday-<标签>-<平台>，老源码再加 -<后端>
      ARTIFACT: Friday-${{ needs.prepare.outputs.release_tag }}-${{ matrix.platform }}${{ matrix.backend != 'none' && format('-{0}', matrix.backend) || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          fetch-depth: 1

      - name: Load pinned versions (qt/ci/deps.env)
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=' src/qt/ci/deps.env | tr -d '\r' | tee -a "${GITHUB_ENV}"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # g++-12：C++20 支持更完整，且 22.04 自带的 libstdc++ 就是 12，编出来的程序在原版 22.04 上能跑
          # 其余：Qt 运行 / 部署（xcb、Wayland、朗读、多媒体）、AppImage 工具需要的库；
          # 老源码（带本地推理）另要 Vulkan 加载器（libvulkan-dev 提供链接用的 libvulkan.so：LunarG 的 Linux SDK 只带头文件和 glslc，不带加载器）
          VULKAN=()
          if [ "${{ matrix.backend }}" != "none" ]; then VULKAN=(libvulkan1 libvulkan-dev); fi
          sudo apt-get install -y --no-install-recommends \
            g++-12 ninja-build ccache pigz file desktop-file-utils patchelf \
            libgl1-mesa-dev libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libspeechd2 libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1 \
            "${VULKAN[@]}"
          {
            echo "CC=gcc-12"
            echo "CXX=g++-12"
            echo "CUDAHOSTCXX=g++-12"
          } >> "${GITHUB_ENV}"

      - name: Install Qt ${{ env.FRIDAY_QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.FRIDAY_QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: ${{ env.FRIDAY_QT_MODULES }}
          aqtsource: ${{ env.FRIDAY_AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt-${{ matrix.platform }}

      - name: Install CUDA Toolkit ${{ env.FRIDAY_CUDA_VERSION }} (Windows)
        if: matrix.backend == 'cuda' && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.FRIDAY_CUDA_VERSION }}
          method: network
          # 只装编译 ggml-cuda 需要的：nvcc、运行库、cuBLAS、CCCL（thrust / cub 头文件）、VS 集成
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: false

      - name: Install CUDA Toolkit ${{ env.FRIDAY_CUDA_VERSION }} (Linux)
        if: matrix.backend == 'cuda' && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.FRIDAY_CUDA_VERSION }}
          method: network
          # cuda-driver-dev 提供 libcuda.so 链接桩（构建机没有 NVIDIA 驱动）
          sub-packages: '["nvcc", "cudart-dev", "cccl", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
          use-github-cache: false

      - name: Cache Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\VulkanSDK' || 'vulkan-sdk' }}
          key: vulkan-sdk-${{ runner.os }}-${{ env.FRIDAY_VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK ${{ env.FRIDAY_VULKAN_SDK_VERSION }} (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:FRIDAY_VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$ver"
          if (-not (Test-Path "$root\Bin\glslc.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
            curl.exe -fsSL --retry 3 -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
            & $installer --root $root --accept-licenses --default-answer --confirm-command install
            if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK 安装失败（退出码 $LASTEXITCODE）" }
          }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$root\Bin\glslc.exe" --version

      - name: Install Vulkan SDK ${{ env.FRIDAY_VULKAN_SDK_VERSION }} (Linux)
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          SDK="${GITHUB_WORKSPACE}/vulkan-sdk"
          if [ ! -x "${SDK}/x86_64/bin/glslc" ]; then
            rm -rf "${SDK}" && mkdir -p "${SDK}"
            curl -fsSL --retry 3 "https://sdk.lunarg.com/sdk/download/${FRIDAY_VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
              | tar -xJ -C "${SDK}" --strip-components=1
          fi
          echo "VULKAN_SDK=${SDK}/x86_64" >> "${GITHUB_ENV}"
          echo "${SDK}/x86_64/bin" >> "${GITHUB_PATH}"
          "${SDK}/x86_64/bin/glslc" --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: qt-${{ matrix.platform }}-${{ matrix.backend }}
          variant: ccache
          max-size: 2G
          create-symlink: false

      # 后端按组件分别缓存（stage/llama、stage/sd，里面有构建戳）：依赖版本、工具链、构建脚本不变就不重编（只有老源码有后端）
      - name: Restore llama-server cache
        id: cache-llama
        if: matrix.backend != 'none'
        uses: actions/cache/restore@v4
        with:
          path: build/backend/stage/llama
          key: backend-llama-${{ matrix.platform }}-${{ matrix.backend }}-${{ env.LLAMA_CPP_TAG }}-${{ matrix.backend == 'cuda' && format('{0}-{1}', env.FRIDAY_CUDA_VERSION, env.FRIDAY_CUDA_ARCHITECTURES) || env.FRIDAY_VULKAN_SDK_VERSION }}-${{ hashFiles('src/qt/ci/build_backends.sh', 'src/qt/ci/build_backends.ps1') }}

      - name: Restore sd-cli cache
        id: cache-sd
        if: matrix.backend != 'none'
        uses: actions/cache/restore@v4
        with:
          path: build/backend/stage/sd
          key: backend-sd-${{ matrix.platform }}-${{ matrix.backend }}-${{ env.SD_CPP_TAG }}-${{ env.SD_GGML_COMMIT }}-${{ matrix.backend == 'cuda' && format('{0}-{1}', env.FRIDAY_CUDA_VERSION, env.FRIDAY_CUDA_ARCHITECTURES) || env.FRIDAY_VULKAN_SDK_VERSION }}-${{ hashFiles('src/qt/ci/build_backends.sh', 'src/qt/ci/build_backends.ps1') }}

      - name: Build backends (Windows)
        if: runner.os == 'Windows' && matrix.backend != 'none'
        shell: pwsh
        run: pwsh -NoProfile -File src/qt/ci/build_backends.ps1 -Backend ${{ matrix.backend }} -Out "$env:BACKEND_OUT"

      - name: Build backends (Linux)
        if: runner.os == 'Linux' && matrix.backend != 'none'
        run: bash src/qt/ci/build_backends.sh --backend ${{ matrix.backend }} --out "${BACKEND_OUT}"

      # 后端一编好就存缓存（不等整个 job 成功），后面应用或打包失败也不用重编 CUDA
      - name: Save llama-server cache
        if: matrix.backend != 'none' && steps.cache-llama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/backend/stage/llama
          key: ${{ steps.cache-llama.outputs.cache-primary-key }}

      - name: Save sd-cli cache
        if: matrix.backend != 'none' && steps.cache-sd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/backend/stage/sd
          key: ${{ steps.cache-sd.outputs.cache-primary-key }}

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File src/qt/ci/build_app.ps1 -BuildDir "$env:APP_BUILD" -Prefix "$env:APP_STAGE" -NoRunTests

      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: bash src/qt/ci/build_app.sh --build-dir "${APP_BUILD}" --prefix "${APP_STAGE}" --no-run-tests

      # 单元测试单独一步、按测试类分进程跑（某个类崩溃也能看出是哪个）；失败不挡打包，
      # 产物照常上传，最后一步再把这个 job 标成失败
      - name: Unit tests (Windows)
        id: tests_win
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoProfile -File src/qt/ci/run_tests.ps1 -BuildDir "$env:APP_BUILD"

      - name: Unit tests (Linux)
        id: tests_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        run: bash src/qt/ci/run_tests.sh --build-dir "${APP_BUILD}"

      # 源码有 qt/installer/ 时另出安装程序：部件由 build_app 一起编好，在 <构建目录>/installer 下（老源码的打包脚本不认 -InstallerDir，不传）；
      # 老源码（带本地推理）的打包脚本要 -Backend 和过渡期的 backend 目录
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HAS_INSTALLER: ${{ needs.prepare.outputs.has_installer }}
          BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgArgs = @('-Stage', "$env:APP_STAGE", '-Tag', "$env:FRIDAY_RELEASE_TAG", '-OutDir', "$env:DIST")
          if ($env:BACKEND -ne 'none') { $pkgArgs += @('-Backend', $env:BACKEND, '-BackendDir', "$env:BACKEND_OUT/backend") }
          if ($env:HAS_INSTALLER -eq 'true') { $pkgArgs += @('-InstallerDir', "$env:APP_BUILD/installer") }
          pwsh -NoProfile -File src/qt/ci/package_windows.ps1 @pkgArgs
          if ($LASTEXITCODE -ne 0) { throw "package_windows.ps1 失败（退出码 $LASTEXITCODE）" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          ARGS=(--stage "${APP_STAGE}" --tag "${FRIDAY_RELEASE_TAG}" --out "${DIST}" --tools-dir "${RUNNER_TEMP}/appimage-tools")
          if [ "${BACKEND}" != "none" ]; then ARGS+=(--backend "${BACKEND}" --backend-dir "${BACKEND_OUT}/backend"); fi
          bash src/qt/ci/package_linux.sh "${ARGS[@]}"

      - name: Upload artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Wait before retrying upload
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Upload artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      # 安装程序真装一遍：运行器上是管理员（没有 UAC 确认框），静默装到临时目录 → 核对文件、friday-cli 能起、「应用和功能」的注册信息
      # → 静默卸载 → 目录（收尾进程异步删）和注册信息都没了。失败不挡发布，最后一步把 job 标红
      - name: Verify installer (Windows)
        id: verify_installer
        if: runner.os == 'Windows' && needs.prepare.outputs.has_installer == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -LiteralPath $env:DIST -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'dist 里没有安装程序' }
          $dir = 'C:\FridayInstallTest'
          $arpKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Friday'
          $log = Join-Path $env:TEMP 'friday-setup.log'
          try {
            $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S /D=$dir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "静默安装失败（退出码 $($p.ExitCode)）" }
            foreach ($f in 'friday.exe', 'friday-cli.exe', 'uninstall.exe', 'FridaySetupUI.exe', 'package.json') {
              if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "装完缺 $f" }
            }
            & (Join-Path $dir 'friday-cli.exe') --version
            if ($LASTEXITCODE -ne 0) { throw "装好的 friday-cli --version 退出码 $LASTEXITCODE" }
            $arp = Get-ItemProperty -LiteralPath $arpKey
            if ($arp.InstallLocation -ne $dir) { throw "注册表里的 InstallLocation 是 '$($arp.InstallLocation)'，不是 $dir" }
            Write-Host "应用和功能：$($arp.DisplayName) $($arp.DisplayVersion)（$($arp.EstimatedSize) KB），卸载：$($arp.QuietUninstallString)"
            $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "静默卸载失败（退出码 $($u.ExitCode)）" }
            for ($i = 0; $i -lt 60 -and (Test-Path -LiteralPath $dir); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path -LiteralPath $dir) { throw "卸载后程序目录还在：$dir" }
            if (Test-Path -LiteralPath $arpKey) { throw '卸载后「应用和功能」的注册信息还在' }
            Write-Host '安装程序核对通过：静默安装、启动、静默卸载'
          } finally {
            if (Test-Path -LiteralPath $log) { Write-Host '--- friday-setup.log ---'; Get-Content -LiteralPath $log -Encoding utf8 | Select-Object -Last 40 }
          }

      # deb 真装一遍：apt 补依赖 → /usr/bin/friday-cli 能起 → 卸掉
      - name: Verify deb (Linux)
        id: verify_deb
        if: runner.os == 'Linux' && needs.prepare.outputs.has_installer == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          DEB="$(ls "${DIST}"/*.deb | head -1)"
          dpkg-deb --info "${DEB}"
          sudo apt-get install -y "${DEB}"
          test -x /opt/friday/AppRun
          test -f /usr/share/applications/friday.desktop
          env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen /usr/bin/friday-cli --version
          sudo apt-get remove -y friday
          test ! -e /opt/friday/usr/bin/friday
          echo "deb 核对通过：apt 安装、启动、卸载"

      - name: Fail if unit tests or package checks failed
        if: steps.tests_win.outcome == 'failure' || steps.tests_linux.outcome == 'failure' || steps.verify_installer.outcome == 'failure' || steps.verify_deb.outcome == 'failure'
        env:
          TESTS: ${{ steps.tests_win.outcome }}${{ steps.tests_linux.outcome }}
          INSTALLER: ${{ steps.verify_installer.outcome }}${{ steps.verify_deb.outcome }}
        run: |
          case "${TESTS}" in *failure*) echo "::error title=单元测试失败::产物已上传，但单元测试没有全部通过，详见「Unit tests」一步的输出" ;; esac
          case "${INSTALLER}" in *failure*) echo "::error title=安装包核对失败::产物已上传，但安装程序 / deb 没能装上、启动或卸掉，详见「Verify installer / deb」一步的输出" ;; esac
          exit 1

  # ---------------------------------------------------------------------------
  # 发布：一次性上传全部产物，每个渠道只留最新 Release，更新 latest.json
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [prepare, macos, qt]
    # macOS 成功才发布；Qt 某个组合失败（或整个跳过）不挡发布
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Friday-${{ needs.prepare.outputs.release_tag }}-*
          merge-multiple: true
          path: dist

      # v2.0 起一个平台只有一套包，1.x 的 Qt 版还按 "<系统>-<架构>-<后端>"（cuda / vulkan）找包，便携 zip 和 tar.gz 解开后还核对
      # package.json 的 asset 要和自己一致：给它们各做一份只改了 package.json 的同内容包（-upgrade-<后端>），latest.json 里挂在老键下；
      # 安装程序、AppImage、deb 不核对，老键直接指向新包
      - name: Upgrade packages for 1.x (Qt)
        if: needs.prepare.outputs.has_qt == 'true' && needs.prepare.outputs.qt_backends == '["none"]'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, pathlib, re, tarfile, zipfile
          tag = os.environ["RELEASE_TAG"]
          dist = pathlib.Path("dist")

          def patched(data, key):
              info = json.loads(data)
              info["asset"] = key
              return (json.dumps(info, ensure_ascii=False, indent=2) + "\n").encode()

          for backend in ("cuda", "vulkan"):
              src = dist / f"Friday-{tag}-windows-x64.zip"
              if src.exists():
                  dst = dist / f"Friday-{tag}-windows-x64-upgrade-{backend}.zip"
                  done = False
                  with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
                      for item in zin.infolist():
                          data = zin.read(item)
                          if re.fullmatch(r"[^/]+/package\.json", item.filename):
                              data, done = patched(data, f"windows-x64-{backend}"), True
                          zout.writestr(item, data)
                  if not done:
                      raise SystemExit(f"{src.name} 里没有 <顶层目录>/package.json")
                  print(f"{dst.name}（{dst.stat().st_size // 1048576} MB）")
              src = dist / f"Friday-{tag}-linux-x64.tar.gz"
              if src.exists():
                  dst = dist / f"Friday-{tag}-linux-x64-upgrade-{backend}.tar.gz"
                  done = False
                  with tarfile.open(src, "r:gz") as tin, tarfile.open(dst, "w:gz", compresslevel=6) as tout:
                      for member in tin:
                          if member.isfile() and re.fullmatch(r"[^/]+/usr/bin/package\.json", member.name):
                              data, done = patched(tin.extractfile(member).read(), f"linux-x64-{backend}"), True
                              member.size = len(data)
                              tout.addfile(member, io.BytesIO(data))
                          else:
                              tout.addfile(member, tin.extractfile(member) if member.isfile() else None)
                  if not done:
                      raise SystemExit(f"{src.name} 里没有 <顶层目录>/usr/bin/package.json")
                  print(f"{dst.name}（{dst.stat().st_size // 1048576} MB）")
          PY

      - name: Checksums and release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          MARKETING: ${{ needs.prepare.outputs.marketing }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REF: ${{ needs.prepare.outputs.ref }}
          REF_NAME: ${{ needs.prepare.outputs.ref_name }}
          SUBJECT: ${{ needs.prepare.outputs.subject }}
          HAS_QT: ${{ needs.prepare.outputs.has_qt }}
          HAS_INSTALLER: ${{ needs.prepare.outputs.has_installer }}
          QT_BACKENDS: ${{ needs.prepare.outputs.qt_backends }}
          QT_RESULT: ${{ needs.qt.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export NOTES="${RUNNER_TEMP}/release-notes.md" RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          env = os.environ
          tag, marketing, channel = env["RELEASE_TAG"], env["MARKETING"], env["CHANNEL"]
          dist = pathlib.Path("dist")
          # 所有产物重新算一遍 SHA-256（macOS 的 artifact 里自带的那份只覆盖 zip / dmg）
          files = sorted(p for p in dist.iterdir() if p.is_file() and p.name != "SHA256SUMS.txt")
          lines = []
          for p in files:
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              lines.append(f"{h.hexdigest()}  {p.name}")
          (dist / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))

          installers = env.get("HAS_INSTALLER") == "true"
          # 包名里的后端：老源码 -cuda / -vulkan，v2.0 起没有
          suffixes = [f"-{b}" if b != "none" else "" for b in json.loads(env.get("QT_BACKENDS") or '["none"]')]
          gpu = suffixes != [""]
          qt_assets = {}
          for suffix in suffixes:
              qt_assets[f"windows-x64{suffix}"] = [f"Friday-{tag}-windows-x64{suffix}.zip"] + (
                  [f"Friday-{tag}-windows-x64{suffix}-setup.exe"] if installers else [])
              qt_assets[f"linux-x64{suffix}"] = [f"Friday-{tag}-linux-x64{suffix}.AppImage", f"Friday-{tag}-linux-x64{suffix}.tar.gz"] + (
                  [f"Friday-{tag}-linux-x64{suffix}.deb"] if installers else [])
          missing = [key for key, names in qt_assets.items() if not all((dist / n).exists() for n in names)]
          stable = channel == "stable"
          lines = [
              f"Friday {marketing} {'正式版' if stable else 'Beta'}",
              "",
              f"- 渠道：{'正式版（main 分支）' if stable else 'Beta（分支 ' + env['REF_NAME'] + '）'}，构建号 {env['RUN_NUMBER']}",
              f"- 源码：{env['SOURCE_REPO']} @ `{env['REF']}`（{env['REF_NAME']}）",
              f"- 提交：{env.get('SUBJECT', '')}",
              f"- 构建：{env['RUN_URL']}",
              "",
              "### macOS（26+，Apple Silicon）",
              "",
              "- 安装：打开 dmg，双击图标即可运行（也可拖到「应用程序」）；zip 为纯 app 包",
              "- 自动更新：Friday 会定期读取本仓库的 latest.json，发现新版本后自动下载、验签、换包重启（设置 › 通用 里可关，也可选只收正式版）",
              "- 签名：Developer ID 签名并经 Apple 公证（dmg 与 app 都钉了公证票据），下载后直接打开",
          ]
          if env["HAS_QT"] == "true":
              win_ext = "-setup.exe` / `.zip" if installers else ".zip"
              linux_ext = ".deb` / `.AppImage` / `.tar.gz" if installers else ".AppImage` / `.tar.gz"
              lines += ["", "### Windows（10 / 11，x64）", ""]
              if gpu:
                  lines += [
                      f"- `Friday-{tag}-windows-x64-cuda{win_ext}`：NVIDIA 显卡（GTX 10 系列及更新，建议驱动 570 以上），本地模型、生图、生视频用 CUDA 加速",
                      f"- `Friday-{tag}-windows-x64-vulkan{win_ext}`：AMD / Intel / NVIDIA 显卡通用（需要支持 Vulkan 1.2 的显卡驱动），拿不准就选这个",
                  ]
              else:
                  lines += [f"- `Friday-{tag}-windows-x64{win_ext}`：接在线大模型（设置 › 密钥 里添加），不需要显卡"]
              if installers:
                  lines += [
                      "- 安装程序（`-setup.exe`）：双击安装到 `C:\\Program Files\\Friday`（可改位置），建桌面和开始菜单快捷方式，在「设置 › 应用」里可以卸载；"
                      "更新时弹一次管理员确认（UAC）",
                      "- 便携版（`.zip`）：解压到任意位置（例如 `D:\\Friday`），运行 `Friday\\friday.exe`；放在用户可写的目录时自动更新不需要管理员确认",
                  ]
              else:
                  lines += ["- 安装：解压到任意位置（例如 `D:\\Friday`），运行 `Friday\\friday.exe`"]
              lines += [
                  "- 不需要另装 VC++ 运行库；没有代码签名，首次运行时 SmartScreen 提示请点「更多信息 → 仍要运行」",
                  "- 数据在 `%APPDATA%\\Friday`，和程序目录分开；覆盖、删除或卸载程序都不影响会话和设置",
                  "",
                  "### Linux（x64，glibc 2.35 以上：Ubuntu 22.04 / Debian 12 / Fedora 36 及更新）",
                  "",
              ]
              if gpu:
                  lines += [
                      f"- `Friday-{tag}-linux-x64-cuda{linux_ext}`：NVIDIA 显卡（专有驱动 570 以上）",
                      f"- `Friday-{tag}-linux-x64-vulkan{linux_ext}`：AMD / Intel / NVIDIA 通用（Mesa 或厂商的 Vulkan 驱动，需要 libvulkan1）",
                  ]
              else:
                  lines += [f"- `Friday-{tag}-linux-x64{linux_ext}`：接在线大模型，不需要显卡"]
              if installers:
                  lines += ["- deb（Debian / Ubuntu 系）：`sudo apt install ./Friday-*.deb`，装到 `/opt/friday`，应用菜单里有 Friday，"
                            "命令行 `friday` / `friday-cli`；`sudo apt remove friday` 卸载；更新时弹一次密码确认"]
              lines += [
                  "- AppImage：`chmod +x Friday-*.AppImage` 后直接运行；系统没有 FUSE 时加 `--appimage-extract-and-run` 参数，或改用 tar.gz",
                  "- tar.gz：解压后运行 `Friday/AppRun`；朗读功能需要系统装有 speech-dispatcher",
                  "- 数据在 `~/.local/share/Friday`（或 `$XDG_DATA_HOME/Friday`）",
                  "",
                  "Windows / Linux 版同样读取 latest.json 按「系统-架构" + ("-后端" if gpu else "") + "」和安装方式（便携版 / 安装程序 / AppImage / deb / tar.gz）取对应的包更新。",
              ]
              if not gpu:
                  lines += ["", "从 1.x 升级：v2.0 起不再带本地模型（不用 CUDA / Vulkan），1.x 的 CUDA 版、Vulkan 版都自动更新到这一套包；"
                            "`-upgrade-cuda` / `-upgrade-vulkan` 两种 zip / tar.gz 只给 1.x 自动更新用（内容相同，只是包信息里的名字不同），不用下载。"
                            "以前下载的本地模型还在缓存目录里，不再使用，可以手动删掉。"]
              if missing:
                  lines += ["", f"> ⚠️ 本次缺少以下 Windows / Linux 安装包（构建失败，详见构建日志）：{'、'.join(missing)}"]
          else:
              lines += ["", "> 本次只发布 macOS 版（源码里还没有 qt/ 目录，或手动运行时关闭了 Qt 版构建）。"]
          lines += ["", "全部文件的 SHA-256 见 SHA256SUMS.txt。"]
          pathlib.Path(env["NOTES"]).write_text("\n".join(lines) + "\n")
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"notes={env['NOTES']}\n")
              out.write(f"missing={','.join(missing) if env['HAS_QT'] == 'true' else ''}\n")
          PY
          cat "${NOTES}"
          echo "Qt job 结果：${QT_RESULT}"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.notes }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS.txt

      - name: Keep only the latest release per channel
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # 正式版和预发布各只保留版本号最大的一个：旧 Release 连同安装包一起删掉；标签保留，第三位才能接着数。
          # 并行的运行可能晚于更新的版本完成：这时最大的不是自己，就连自己刚发的也删掉
          TAGS="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,isPrerelease,isDraft \
            --jq ".[] | select(.isDraft | not) | select(.isPrerelease == ${PRERELEASE}) | .tagName")"
          KEEP="$(printf '%s\n' "${TAGS}" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$' || true; } \
            | sed -E 's/^v//; s/-beta$//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          printf '%s\n' "${TAGS}" | while read -r tag; do
            [ -n "${tag}" ] || continue
            if [ -n "${KEEP}" ] && { [ "${tag}" = "v${KEEP}" ] || [ "${tag}" = "v${KEEP}-beta" ]; }; then continue; fi
            echo "删除旧发布 ${tag}"
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes || true
          done

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: self
          ref: main
          fetch-depth: 1

      - name: Update latest.json
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          MARKETING: ${{ needs.prepare.outputs.marketing }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          SUBJECT: ${{ needs.prepare.outputs.subject }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          BRANCH: ${{ needs.prepare.outputs.ref_name }}
          MIN_OS: ${{ needs.prepare.outputs.min_os }}
        run: |
          set -euo pipefail
          # 每个渠道只记录最新的一次发布；应用按渠道读取并与自己的版本比较
          export MIN_OS="${MIN_OS:-26.0}" BASENAME="Friday-${RELEASE_TAG}-macOS-arm64" REPO="${GITHUB_REPOSITORY}" RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          python3 - <<'PY'
          import datetime, json, os, pathlib
          tag, channel, basename, repo = os.environ["RELEASE_TAG"], os.environ["CHANNEL"], os.environ["BASENAME"], os.environ["REPO"]
          sums = {line.split()[1].lstrip("*"): line.split()[0] for line in pathlib.Path("dist/SHA256SUMS.txt").read_text().splitlines() if line.strip()}
          zip_name, dmg_name = f"{basename}.zip", f"{basename}.dmg"

          def asset(name):
              path = pathlib.Path("dist") / name
              if not path.exists():
                  return None
              return {
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": sums[name],
                  "size": path.stat().st_size,
              }

          # Qt 版按 "<系统>-<架构>"（v2.0 之前是 "<系统>-<架构>-<后端>"）取自己的包；Windows 条目是 zip，安装程序挂在 installer 下；
          # Linux 条目是 AppImage，tar.gz 挂在 tarball 下、deb 挂在 deb 下（应用按自己的安装方式取，见源码 qt/docs/PACKAGING.md §4）
          # （macOS 版的 ReleaseEntry 是编译器合成的 Codable，解码时忽略这个多出来的键）
          def qt_entry(suffix, zip_name=None, tarball_name=None):
              entries = {}
              win = asset(zip_name or f"Friday-{tag}-windows-x64{suffix}.zip")
              if win:
                  installer = asset(f"Friday-{tag}-windows-x64-setup.exe" if zip_name else f"Friday-{tag}-windows-x64{suffix}-setup.exe")
                  if installer:
                      win["installer"] = installer
                  entries["windows-x64"] = win
              appimage = asset(f"Friday-{tag}-linux-x64.AppImage" if tarball_name else f"Friday-{tag}-linux-x64{suffix}.AppImage")
              if appimage:
                  tarball = asset(tarball_name or f"Friday-{tag}-linux-x64{suffix}.tar.gz")
                  if tarball:
                      appimage["tarball"] = tarball
                  deb = asset(f"Friday-{tag}-linux-x64.deb" if tarball_name else f"Friday-{tag}-linux-x64{suffix}.deb")
                  if deb:
                      appimage["deb"] = deb
                  entries["linux-x64"] = appimage
              return entries

          assets = {}
          for backend in ("cuda", "vulkan"):
              for platform, item in qt_entry(f"-{backend}").items():
                  assets[f"{platform}-{backend}"] = item
          if not assets:
              # v2.0 起：一个平台一套包；1.x 的老键指向同一套包，便携 zip / tar.gz 换成 package.json 对得上的 -upgrade-<后端>
              assets.update(qt_entry(""))
              for backend in ("cuda", "vulkan"):
                  for platform, item in qt_entry("", f"Friday-{tag}-windows-x64-upgrade-{backend}.zip",
                                                 f"Friday-{tag}-linux-x64-upgrade-{backend}.tar.gz").items():
                      assets[f"{platform}-{backend}"] = item

          entry = {
              "tag": tag,
              "version": os.environ["MARKETING"],
              "build": int(os.environ["RUN_NUMBER"]),
              "channel": channel,
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "zip": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
              "dmg": f"https://github.com/{repo}/releases/download/{tag}/{dmg_name}" if os.path.exists(f"dist/{dmg_name}") else None,
              "sha256": sums[zip_name],
              "size": os.path.getsize(f"dist/{zip_name}"),
              "notes": os.environ.get("SUBJECT", ""),
              "minOS": os.environ["MIN_OS"],
              "release": f"https://github.com/{repo}/releases/tag/{tag}",
              "source": os.environ.get("SOURCE_REF", ""),
              "branch": os.environ.get("BRANCH", ""),
              "assets": assets,
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "latest-entry.json").write_text(json.dumps(entry, ensure_ascii=False))
          PY
          cd self
          git config user.name "integemjack"
          git config user.email "jack.wang@integem.com"
          # 只往前更新：渠道里已经是更新的版本（并行的运行先发布了）就不动；推送冲突时基于最新的 main 重来
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            UPDATED="$(python3 - <<'PY'
          import json, os, pathlib, re
          entry = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "latest-entry.json").read_text())
          def key(version):
              m = re.match(r"^(\d+)\.(\d+)(?:\.(\d+))?", str(version or ""))
              return tuple(int(x or 0) for x in m.groups()) if m else (-1,)
          path = pathlib.Path("latest.json")
          manifest = json.loads(path.read_text()) if path.exists() else {}
          current = manifest.get(entry["channel"])
          if current and current.get("tag") != entry["tag"] and key(current.get("version")) > key(entry["version"]):
              print("no")
          else:
              manifest[entry["channel"]] = entry
              manifest["updatedAt"] = entry["date"]
              path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
              print("yes")
          PY
          )"
            if [ "${UPDATED}" != "yes" ]; then
              echo "latest.json 的 ${CHANNEL} 渠道已经是更新的版本，不更新"
              break
            fi
            cat latest.json
            git add latest.json
            git commit -q -m "latest.json：${CHANNEL} → ${RELEASE_TAG}"
            if git push -q origin HEAD:main; then break; fi
            echo "推送 latest.json 冲突，重试（第 ${attempt} 次）"
            sleep $((RANDOM % 5 + 2))
          done
